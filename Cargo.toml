[package]
name = "orbital-shell-mobile"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
description = "React Native mobile shell for Orbital compiler"

[dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
orbital-shell-typescript = { git = "https://github.com/almadar-io/orbital-shell-typescript", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"
